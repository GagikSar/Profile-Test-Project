<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Search - Compact Modern UI</title>
    
    <!-- Font Awesome սիկոններ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
        }

        /* Header - Դասավորվածություն աջ կողմում */
        header {
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            padding: 0 30px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            height: 65px;
        }

        .global-search-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Search Box - Կարճացված երկարություն (350px) */
        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 350px; /* Կրճատված երկարություն */
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .search-box:hover, .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        /* Mode Selector (Amazon Style) */
        .mode-dropdown {
            position: relative;
            border-right: 1px solid var(--border);
        }

        .mode-btn {
            background: #f8fafc;
            border: none;
            padding: 9px 12px;
            cursor: pointer;
            border-top-left-radius: 7px;
            border-bottom-left-radius: 7px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .mode-menu {
            position: absolute;
            top: 45px;
            left: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            width: 260px;
            display: none;
            z-index: 1000;
            padding: 5px 0;
        }

        .mode-menu.show {
            display: block;
        }

        .mode-option {
            padding: 9px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13.5px;
        }

        .mode-option:hover {
            background-color: #f1f5f9;
        }

        .mode-option i {
            width: 18px;
            text-align: center;
            color: var(--text-light);
        }

        .sub-option {
            padding-left: 35px;
            font-size: 12.5px;
            color: var(--text-light);
        }

        /* Input բաժին */
        .search-input-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            padding: 0 8px;
        }

        .search-input {
            border: none;
            outline: none;
            width: 100%;
            height: 34px;
            font-size: 14px;
            background: transparent;
        }

        .shortcut-hint {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-light);
            background: #f1f5f9;
            padding: 2px 4px;
            border-radius: 4px;
            margin-right: 6px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            color: var(--text-light);
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        /* Ընդլայնված փնտրման կոճակ */
        .advanced-search-btn {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .advanced-search-btn:hover {
            background: #f1f5f9;
            color: var(--text);
        }

        .content {
            padding: 60px;
            text-align: center;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<header>
    <div class="global-search-container">
        <div class="search-box">
            
            <!-- Ռեժիմի ընտրություն -->
            <div class="mode-dropdown">
                <button class="mode-btn" id="activeModeBtn">
                    <i class="fa-solid fa-folder-open" id="currentIcon"></i>
                    <i class="fa-solid fa-caret-down" style="font-size: 0.7em;"></i>
                </button>
                
                <div class="mode-menu" id="modeMenu">
                    <div class="mode-option" data-mode="folder" data-icon="fa-folder-open">
                        <i class="fa-solid fa-folder-open"></i> Հաճախորդի թղթապանակ
                    </div>
                    <div class="mode-option" data-mode="customer" data-icon="fa-user">
                        <i class="fa-solid fa-user"></i> Հաճախորդ
                    </div>
                    <div class="mode-option" data-mode="account" data-icon="fa-file-invoice-dollar">
                        <i class="fa-solid fa-file-invoice-dollar"></i> Հաշիվ
                    </div>
                    <div class="mode-option" data-mode="card" data-icon="fa-credit-card">
                        <i class="fa-solid fa-credit-card"></i> Քարտ
                    </div>
                    <div class="mode-option" data-mode="contract" data-icon="fa-file-contract">
                        <i class="fa-solid fa-file-contract"></i> Պայմանագիր
                    </div>
                    <!-- Ենթակետեր -->
                    <div class="mode-option sub-option" data-mode="c-alloc" data-icon="fa-hand-holding-dollar">
                        <i class="fa-solid fa-hand-holding-dollar"></i> Տեղաբաշխված միջոց
                    </div>
                    <div class="mode-option sub-option" data-mode="c-attr" data-icon="fa-piggy-bank">
                        <i class="fa-solid fa-piggy-bank"></i> Ներգրավված միջոց
                    </div>
                    <div class="mode-option sub-option" data-mode="c-guar" data-icon="fa-shield-halved">
                        <i class="fa-solid fa-shield-halved"></i> Գրավ/Երաշխավորություն
                    </div>
                    <div class="mode-option sub-option" data-mode="c-deriv" data-icon="fa-chart-line">
                        <i class="fa-solid fa-chart-line"></i> Ածանցյալ գործիք
                    </div>
                    
                    <div class="mode-option" data-mode="isn" data-icon="fa-file-code">
                        <i class="fa-solid fa-file-code"></i> Փաստաթուղթ (ISN)
                    </div>
                </div>
            </div>

            <!-- Input -->
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="mainInput" placeholder="Փնտրել..." tabindex="1">
                <span class="shortcut-hint">Ctrl+K</span>
                <button class="icon-btn" id="executeSearch">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <button class="advanced-search-btn" title="Ընդլայնված փնտրում">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </div>
</header>

<div class="content">
    <h1>Compact Search UI</h1>
    <p>Կոմպակտ ոճ՝ 350px լայնությամբ</p>
</div>

<script>
    const modeBtn = document.getElementById('activeModeBtn');
    const modeMenu = document.getElementById('modeMenu');
    const currentIcon = document.getElementById('currentIcon');
    const mainInput = document.getElementById('mainInput');
    const options = document.querySelectorAll('.mode-option');

    modeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        modeMenu.classList.toggle('show');
    });

    options.forEach(opt => {
        opt.addEventListener('click', () => {
            const icon = opt.getAttribute('data-icon');
            const mode = opt.getAttribute('data-mode');
            currentIcon.className = `fa-solid ${icon}`;
            localStorage.setItem('searchMode', mode);
            localStorage.setItem('searchIcon', icon);
            modeMenu.classList.remove('show');
            mainInput.focus();
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const savedMode = localStorage.getItem('searchMode');
        const savedIcon = localStorage.getItem('searchIcon');
        if (savedMode && savedIcon) {
            currentIcon.className = `fa-solid ${savedIcon}`;
        }
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            mainInput.focus();
        }
    });

    window.addEventListener('click', () => {
        modeMenu.classList.remove('show');
    });

    function runSearch() {
        if (mainInput.value.trim() !== "") {
            alert("Փնտրում: " + mainInput.value);
        }
    }

    document.getElementById('executeSearch').addEventListener('click', runSearch);
    mainInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runSearch();
    });
</script>

</body>
</html>
